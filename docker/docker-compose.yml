# ===================================================================
# Nearza — Docker Compose for Local Development
# Database is Supabase Cloud (not containerized).
# ===================================================================

version: "3.9"

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: nearza-backend
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
    volumes:
      - ../backend:/app
    command: python manage.py runserver 0.0.0.0:8000
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: nearza-frontend
    ports:
      - "5173:5173"
    env_file:
      - ../frontend/.env
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
